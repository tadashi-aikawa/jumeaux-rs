name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Check tag against Cargo.toml
        id: version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "jumeaux") | .version')"
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml v${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            zig: false
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            zig: false
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            zig: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            zig: true
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: astral-sh/setup-uv@v10
        if: matrix.zig
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Install cargo-zigbuild and Zig
        if: matrix.zig
        run: |
          uv tool install cargo-zigbuild==0.24.1 --with ziglang==0.15.2
          uv tool dir --bin >> "$GITHUB_PATH"
          printf 'CARGO_ZIGBUILD_PYTHON_PATH=%s/cargo-zigbuild/bin/python\n' "$(uv tool dir)" >> "$GITHUB_ENV"
      - name: Build macOS binary
        if: ${{ !matrix.zig }}
        run: cargo build --locked --release --target "$TARGET" --bin jumeaux
      - name: Build Linux binary for glibc 2.28
        if: matrix.zig
        run: cargo zigbuild --locked --release --target "${TARGET}.2.28" --bin jumeaux
      - name: Package binary and checksum
        run: |
          package="jumeaux-${VERSION}-${TARGET}"
          mkdir -p "dist/${package}"
          cp "target/${TARGET}/release/jumeaux" LICENSE README.md "dist/${package}/"
          tar -czf "dist/${package}.tar.gz" -C dist "$package"
          cd dist
          shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256"
          shasum -a 256 -c "${package}.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify all release assets
        run: |
          cd dist
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            archive="jumeaux-${VERSION}-${target}.tar.gz"
            test -f "$archive"
            sha256sum -c "${archive}.sha256"
          done
      - name: Create GitHub Release
        run: |
          args=(--verify-tag --generate-notes --title "Jumeaux ${VERSION}")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 "${args[@]}"
