title: Query custom

one:
  name: One endpoint
  host: http://localhost:8000/api/one
  query:
    overwrite:
      # Yesterday
      time: ["2000-01-01"]

other:
  name: Other endpoint
  host: http://localhost:8000/api/other
  query:
    overwrite:
      additional: [hoge]
      # Tomorrow
      time: ["2000-01-03"]
    remove:
      - param

output:
  response_dir: responses

addons:
  log2reqs:
    name: plain

  res2dict:
    - name: json

  store_criterion:
    - name: free
      config:
        when_any:
          - status == 'different'

  dump:
    - name: json

  final:
    - name: json
    - name: viewer
