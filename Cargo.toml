[package]
name = "jumeaux"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Check difference between two responses of API."
repository = "https://github.com/tadashi-aikawa/jumeaux-rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
chardetng = "1.0.0"
chrono = "0.4.45"
encoding_rs = "0.8.44"
fancy-regex = "0.20.0"
indexmap = { version = "2.14.2", features = ["serde"] }
minijinja = { version = "3.0.5", features = ["preserve_order", "serde", "json", "urlencode", "unstable_machinery_serde"] }
minijinja-contrib = { version = "3.0.5", features = ["pycompat", "rand", "wordcount", "wordwrap"] }
regex = "1.13.1"
rustpython-parser = { version = "0.4.0", default-features = false, features = ["num-bigint"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
