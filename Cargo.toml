[package]
name = "jumeaux"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Check difference between two responses of API."
repository = "https://github.com/tadashi-aikawa/jumeaux-rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
num-bigint = "0.4.8"
num-traits = "0.2.19"
quick-xml = "0.38.4"
html5ever = "0.35.0"
scraper = { version = "0.24.0", default-features = false }
