[package]
name = "jumeaux"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Check difference between two responses of API."
repository = "https://github.com/tadashi-aikawa/jumeaux-rs"

[features]
default = ["miroir"]
miroir = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-sdk-dynamodb", "dep:aws-sdk-sts", "dep:aws-smithy-http-client", "dep:aws-types", "dep:zip"]

[dependencies]
base64 = "0.22"
libc = "0.2"
signal-hook-registry = "1.4"
aws-config = { version = "1.13.0", optional = true, default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.157.0", optional = true, default-features = false, features = ["rt-tokio"] }
aws-sdk-dynamodb = { version = "1", optional = true, default-features = false, features = ["rt-tokio"] }
aws-sdk-sts = { version = "1", optional = true, default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.5.2", optional = true, default-features = false, features = ["rustls-ring"] }
aws-types = { version = "1.7.0", optional = true }
zip = { version = "9.4.2", optional = true, default-features = false, features = ["deflate-flate2"] }
clap = { version = "4.6.7", features = ["derive"] }
chardetng = "1.0.0"
chrono = "0.4.45"
encoding_rs = "0.8.44"
fancy-regex = "0.20.0"
indexmap = { version = "2.14.2", features = ["serde"] }
minijinja = { version = "=3.0.5", features = ["preserve_order", "serde", "json", "urlencode", "unstable_machinery_serde"] }
minijinja-contrib = { version = "=3.0.5", features = ["pycompat", "rand", "wordcount", "wordwrap"] }
regex = "1.13.1"
rustpython-parser = { version = "0.4.0", default-features = false, features = ["num-bigint"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision", "unbounded_depth"] }
serde_yaml_ng = "0.10.0"
serde_path_to_error = "0.1.20"
num-bigint = "0.4.8"
num-traits = "0.2.19"
quick-xml = "0.38.4"
html5ever = "0.35.0"
scraper = { version = "0.24.0", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
ring = "0.17"
flate2 = "1"
zstd = "0.13"
cookie_store = { version = "0.22.1", features = ["preserve_order"] }
